name: CAD repository policy and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Reject CAD files in index and reachable history
        run: python scripts/check_cad_policy.py --history
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full synthetic test suite
        run: python -B -m pytest -q -p no:cacheprovider
