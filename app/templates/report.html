<!doctype html><html><head><meta charset="utf-8"><title>DraftLens EDU Report</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;color:#16211b}h1{color:#125c3e}.score{font-size:4rem;font-weight:800}.issue{border-left:5px solid #d95d39;padding:10px 18px;margin:12px 0;background:#fff6f0}@media print{body{margin:15mm}}</style></head><body><h1>DraftLens EDU assessment</h1><div class="score">{{ score }} / 100</div><h2>Findings</h2>{% for i in issues %}<div class="issue"><b>{{ i.category|title }} · {{ i.code }}</b><p>{{ i.message }}</p><small>Deduction: {{ i.deduction }}</small></div>{% else %}<p>No geometric issues detected.</p>{% endfor %}<h2>Learning feedback</h2><ol>{% for f in feedback %}<li>{{ f }}</li>{% endfor %}</ol><script type="application/json" id="draftlens-data">{{ data_json|safe }}</script></body></html>
